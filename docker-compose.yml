# Baza za razvoj i lokalni rad: docker compose up -d --wait baza
services:
  baza:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      # lozinku generira pokreni.bat u .env (BAZA_LOZINKA); bez nje se baza ne pokreće
      POSTGRES_PASSWORD: ${BAZA_LOZINKA:?Postavite BAZA_LOZINKA u .env}
      POSTGRES_DB: erp_wms
      TZ: Europe/Zagreb
      PGTZ: Europe/Zagreb
    ports:
      # samo s ovog računala — baza nikad nije otvorena prema mreži
      # BAZA_PORT u .env (pokreni.bat odabere slobodni ako Windows ne dopusti 5432)
      - "127.0.0.1:${BAZA_PORT:-5432}:5432"
    volumes:
      - baza-podaci:/var/lib/postgresql/data
      - ./docker/baza-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp_wms"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  baza-podaci:
